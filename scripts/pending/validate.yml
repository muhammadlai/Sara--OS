name: Validate Template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate template
        env:
          # Injected by GitHub Actions from the repository secret. Never echo.
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: npm test

      - name: Jina health (real probe only if secret is set)
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: node worker/cli.mjs jina-health
